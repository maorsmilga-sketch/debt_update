<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ניהול כספים - מאור ועידו</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #059669; 
      --primary-hover: #047857; 
      --bg-color: #F3F4F6;
      --card-bg: #ffffff;
      --text-main: #1F2937;
      --text-secondary: #6B7280;
      --border-color: #E5E7EB;
      --success-color: #10B981;
      --error-color: #EF4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Rubik', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 30px;
      overflow: hidden;
      position: relative; 
    }

    /* לוגואים */
    .corner-logo {
      position: absolute;
      top: 20px;
      width: 50px;
      height: auto;
      opacity: 0.9;
    }
    .logo-right { right: 20px; }
    .logo-left { left: 20px; }

    @media (max-width: 400px) {
      .corner-logo { width: 40px; top: 15px; }
      .logo-right { right: 15px; }
      .logo-left { left: 15px; }
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 10px;
      margin-bottom: 25px;
    }

    /* --- סיכומים וטעינה --- */
    .totals-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .total-card {
      flex: 1;
      text-align: center;
      background: #F9FAFB;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      min-width: 0;
      position: relative;
    }

    .total-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .total-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-color);
      min-height: 24px; /* שומר מקום לתוכן */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Skeleton Loader Animation (אנימציית שלד) --- */
    .skeleton {
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
      width: 70%;
      height: 20px;
      display: inline-block;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* אייקון טעינה קטן כשמרעננים מידע קיים */
    .refresh-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 5px;
      left: 5px;
      display: none; /* מוסתר כברירת מחדל */
    }
    .refreshing .refresh-spinner { display: block; }


    /* --- שאר העיצוב (ללא שינוי) --- */
    .section-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: block;
    }
    .user-selector { display: flex; gap: 10px; margin-bottom: 25px; }
    .user-option { flex: 1; position: relative; }
    .user-option input[type="radio"] { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
    .user-card {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 5px; background: #fff; border: 2px solid var(--border-color);
      border-radius: 12px; cursor: pointer; font-weight: 500; font-size: 0.95rem;
      transition: all 0.2s ease; color: var(--text-secondary); white-space: nowrap;
    }
    .user-option input[type="radio"]:checked + .user-card {
      border-color: var(--primary-color); background-color: #ECFDF5;
      color: var(--primary-color); font-weight: 700; box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2); 
    }
    .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .amount-btn {
      background: #fff; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 12px 0; border-radius: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s;
      font-family: 'Rubik', sans-serif;
    }
    .amount-btn:hover { background-color: #F3F4F6; border-color: #D1D5DB; }
    .amount-btn:active { transform: scale(0.95); background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    .input-group { margin-bottom: 15px; }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%; padding: 14px 15px; border: 1px solid var(--border-color);
      border-radius: 12px; font-size: 1rem; font-family: 'Rubik', sans-serif;
      box-sizing: border-box; transition: border-color 0.2s; background: #F9FAFB;
    }
    .input-wrapper input:focus { outline: none; border-color: var(--primary-color); background: #fff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
    .optional-tag { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: #9CA3AF; pointer-events: none; }
    .submit-btn {
      width: 100%; padding: 16px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: background-color 0.2s, transform 0.1s; font-family: 'Rubik', sans-serif;
      margin-top: 10px; box-shadow: 0 4px 6px rgba(5, 150, 105, 0.3); 
    }
    .submit-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(1px); }
    .submit-btn:disabled { background-color: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }
    .status { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height: 20px; font-weight: 500; }
    .status.error { color: var(--error-color); }
    .status.success { color: var(--success-color); }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Player Management Section --- */
    .players-section {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px solid var(--border-color);
    }
    .players-section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 18px;
      text-align: center;
    }
    .add-player-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .add-player-form input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: 'Rubik', sans-serif;
      background: #F9FAFB;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .add-player-form input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }
    .add-player-form button {
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      white-space: nowrap;
      transition: background-color 0.2s;
    }
    .add-player-form button:hover { background-color: var(--primary-hover); }
    .add-player-form button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F9FAFB;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }
    .player-row:hover { border-color: #D1D5DB; }
    .player-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      min-width: 60px;
    }
    .player-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 55px;
    }
    .player-stat-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .player-stat-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    .player-row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
      flex-wrap: wrap;
    }
    .player-action-btn {
      padding: 8px 16px;
      background: #fff;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: all 0.2s;
    }
    .player-action-btn:hover {
      background: var(--primary-color);
      color: white;
    }
    .player-delete-btn {
      padding: 8px 14px;
      background: #fff;
      border: 1.5px solid var(--error-color);
      color: var(--error-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: all 0.2s;
    }
    .player-delete-btn:hover {
      background: var(--error-color);
      color: white;
    }
    .player-delete-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .player-update-form {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-right: auto;
      flex-wrap: wrap;
    }
    .player-update-form input {
      width: 70px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Rubik', sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .player-update-form input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
    }
    .player-update-form .input-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .player-update-form button {
      padding: 8px 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: background-color 0.2s;
    }
    .player-update-form button:hover { background-color: var(--primary-hover); }
    .player-update-form .cancel-btn {
      background: #EF4444;
    }
    .player-update-form .cancel-btn:hover { background: #DC2626; }
    .player-list .skeleton-row {
      height: 52px;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 14px;
    }
    .players-status {
      text-align: center;
      font-size: 0.85rem;
      min-height: 18px;
      font-weight: 500;
      margin-top: 10px;
    }
    .players-status.error { color: var(--error-color); }
    .players-status.success { color: var(--success-color); }
    .player-empty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo1.png" alt="לוגו עץ" class="corner-logo logo-right">
    <img src="logo1.png" alt="לוגו עץ" class="corner-logo logo-left">
    
    <h1>ניהול כספים</h1>

    <div class="totals-container">
      <div class="total-card" id="cardMaor">
        <div class="refresh-spinner"></div>
        <div class="total-label">מאור</div>
        <div class="total-value" id="totalMaor"><span class="skeleton"></span></div>
      </div>
      <div class="total-card" id="cardIdo">
        <div class="refresh-spinner"></div>
        <div class="total-label">עידו</div>
        <div class="total-value" id="totalIdo"><span class="skeleton"></span></div>
      </div>
    </div>

    <span class="section-title">למי לעדכן?</span>
    <div class="user-selector">
      <label class="user-option">
        <input type="radio" name="user" value="מאור">
        <div class="user-card">מאור</div>
      </label>
      <label class="user-option">
        <input type="radio" name="user" value="עידו">
        <div class="user-card">עידו</div>
      </label>
    </div>

    <span class="section-title">בחירה מהירה</span>
    <div class="quick-amounts">
      <button type="button" class="amount-btn" data-amount="50">50</button>
      <button type="button" class="amount-btn" data-amount="100">100</button>
      <button type="button" class="amount-btn" data-amount="150">150</button>
      <button type="button" class="amount-btn" data-amount="200">200</button>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="number" id="manualAmount" step="1" placeholder="סכום אחר (או מינוס להורדה)">
      </div>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" id="note" placeholder="הערה">
        <span class="optional-tag">אופציונלי</span>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn">עדכן יתרה</button>
    <div class="status" id="status"></div>

    <!-- Player Management Section -->
    <div class="players-section">
      <div class="players-section-title">ניהול שחקנים</div>
      <div class="add-player-form">
        <input type="text" id="newPlayerName" placeholder="שם שחקן חדש">
        <button type="button" id="addPlayerBtn">הוסף שחקן</button>
      </div>
      <div class="player-list" id="playerList">
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>
      <div class="players-status" id="playersStatus"></div>
    </div>
  </div>

  <script>
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzPr309QGJevk8eg9uCUiOy9C99fZM5xWmMkFZKNfHybInaCMDJXuNp0Zd2mi4RUECF8A/exec';
    // ==========================================

    const statusEl = document.getElementById('status');
    const totalMaorEl = document.getElementById('totalMaor');
    const totalIdoEl = document.getElementById('totalIdo');
    const manualAmountInput = document.getElementById('manualAmount');
    const noteInput = document.getElementById('note');
    const submitBtn = document.getElementById('submitBtn');
    const playerListEl = document.getElementById('playerList');
    const playersStatusEl = document.getElementById('playersStatus');
    const newPlayerNameInput = document.getElementById('newPlayerName');
    const addPlayerBtn = document.getElementById('addPlayerBtn');

    const USER_STORAGE_KEY = 'selectedUserMaorIdo_V2';
    const TOTALS_CACHE_KEY = 'cachedTotals_V2';
    const PLAYERS_CACHE_KEY = 'cachedPlayers_V1';

    function initUserSelection() {
      const radios = document.querySelectorAll('input[name="user"]');
      const savedUser = localStorage.getItem(USER_STORAGE_KEY);
      let userToSelect = savedUser || 'מאור';
      
      const radioToCheck = Array.from(radios).find(r => r.value === userToSelect);
      if (radioToCheck) radioToCheck.checked = true;

      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          if (radio.checked) {
            localStorage.setItem(USER_STORAGE_KEY, radio.value);
            statusEl.textContent = ''; 
          }
        });
      });
    }

    document.querySelectorAll('.amount-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        manualAmountInput.value = btn.getAttribute('data-amount');
        manualAmountInput.focus();
      });
    });

    submitBtn.addEventListener('click', async () => {
      const userRadio = document.querySelector('input[name="user"]:checked');
      const user = userRadio ? userRadio.value : null;
      const amountStr = manualAmountInput.value.trim();
      const note = noteInput.value.trim();

      statusEl.className = 'status';
      statusEl.textContent = '';

      if (!user) {
        statusEl.textContent = 'יש לבחור למי לעדכן';
        statusEl.classList.add('error');
        return;
      }

      if (!amountStr) {
        statusEl.textContent = 'יש להזין סכום';
        statusEl.classList.add('error');
        manualAmountInput.focus();
        return;
      }

      const amount = parseFloat(amountStr);
      if (isNaN(amount)) {
        statusEl.textContent = 'הסכום אינו תקין';
        statusEl.classList.add('error');
        return;
      }

      const originalBtnText = submitBtn.textContent;
      submitBtn.innerHTML = 'מעדכן... <span class="spinner"></span>';
      submitBtn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, amount, note })
        });

        statusEl.textContent = 'עודכן בהצלחה!';
        statusEl.classList.add('success');
        manualAmountInput.value = '';
        noteInput.value = '';
        
        // לאחר עדכון, נטען שוב מהשרת
        await loadTotals(true);

      } catch (err) {
        console.error(err);
        statusEl.textContent = 'שגיאה בתקשורת עם השרת';
        statusEl.classList.add('error');
      } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
        setTimeout(() => {
            if(statusEl.classList.contains('success')) statusEl.textContent = '';
        }, 3000);
      }
    });

    // פונקציה שמציגה נתונים על המסך
    function renderTotals(totals) {
      if (!totals) return;
      totalMaorEl.innerHTML = (totals['מאור'] || 0).toLocaleString() + ' ₪';
      totalIdoEl.innerHTML = (totals['עידו'] || 0).toLocaleString() + ' ₪';
    }

    // פונקציית הטעינה החכמה
    async function loadTotals(forceRefresh = false) {
      
      // 1. נסה לטעון מהזיכרון המקומי קודם כל (לתצוגה מיידית)
      const cachedData = localStorage.getItem(TOTALS_CACHE_KEY);
      
      if (cachedData && !forceRefresh) {
        // מציגים את המידע הישן מיד
        renderTotals(JSON.parse(cachedData));
        // מוסיפים אינדיקציה שאנחנו מרעננים ברקע (spinner קטן בצד)
        document.querySelectorAll('.total-card').forEach(el => el.classList.add('refreshing'));
      }

      try {
        // 2. מבצעים את הבקשה האמיתית לשרת
        const res = await fetch(API_URL);
        const data = await res.json();
        const totals = data.totals || {};

        // 3. שומרים את המידע החדש בזיכרון המקומי לפעם הבאה
        localStorage.setItem(TOTALS_CACHE_KEY, JSON.stringify(totals));

        // 4. מעדכנים את המסך עם המידע המעודכן ביותר
        renderTotals(totals);

      } catch (err) {
        console.error("Error loading totals:", err);
        // אם הייתה שגיאה ואין לנו כלום בזיכרון, נשאיר את אנימציית הטעינה או נציג שגיאה
        if (!cachedData) {
            totalMaorEl.innerHTML = '-';
            totalIdoEl.innerHTML = '-';
        }
      } finally {
        // מסירים את הספינר הקטן של הרענון
        document.querySelectorAll('.total-card').forEach(el => el.classList.remove('refreshing'));
      }
    }

    // ==========================================
    // Player Management
    // ==========================================

    let openUpdateRow = null; // tracks which player has the update form open

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function jsStringLiteral(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function renderPlayers(players) {
      if (!players || players.length === 0) {
        playerListEl.innerHTML = '<div class="player-empty">אין שחקנים עדיין. הוסף שחקן חדש למעלה.</div>';
        return;
      }
      playerListEl.innerHTML = players.map(p => {
        const safeName = escapeHtml(p.name);
        const jsName = jsStringLiteral(p.name);
        const dataPlayer = encodeURIComponent(p.name);
        return `
        <div class="player-row" data-player="${dataPlayer}">
          <div class="player-name">${safeName}</div>
          <div class="player-stat">
            <span class="player-stat-label">כמות</span>
            <span class="player-stat-value">${(p.count || 0).toLocaleString()}</span>
          </div>
          <div class="player-stat">
            <span class="player-stat-label">סכום</span>
            <span class="player-stat-value">${(p.amount || 0).toLocaleString()} ₪</span>
          </div>
          <div class="player-row-actions">
            <button type="button" class="player-action-btn player-update-trigger" onclick="toggleUpdateForm(this, '${jsName}')">עדכן</button>
            <button type="button" class="player-delete-btn" onclick="deletePlayer('${jsName}', this)">מחק</button>
          </div>
        </div>`;
      }).join('');
    }

    function toggleUpdateForm(btn, playerName) {
      const row = btn.closest('.player-row');

      if (openUpdateRow === playerName) {
        const form = row.querySelector('.player-update-form');
        if (form) form.remove();
        btn.style.display = '';
        openUpdateRow = null;
        return;
      }

      // close any previously open form
      if (openUpdateRow) {
        const prevRow = Array.from(playerListEl.querySelectorAll('.player-row')).find(
          r => decodeURIComponent(r.getAttribute('data-player') || '') === openUpdateRow
        );
        if (prevRow) {
          const prevForm = prevRow.querySelector('.player-update-form');
          if (prevForm) prevForm.remove();
          const prevBtn = prevRow.querySelector('.player-update-trigger');
          if (prevBtn) prevBtn.style.display = '';
        }
      }

      btn.style.display = 'none';
      openUpdateRow = playerName;

      const form = document.createElement('div');
      form.className = 'player-update-form';
      form.innerHTML = `
        <span class="input-label">כמות</span>
        <input type="number" class="update-count" value="1" min="0">
        <span class="input-label">סכום</span>
        <input type="number" class="update-amount" placeholder="0">
        <button type="button" onclick="submitPlayerUpdate('${playerName.replace(/'/g, "\\'")}', this)">שמור</button>
        <button type="button" class="cancel-btn" onclick="toggleUpdateForm(this.closest('.player-row').querySelector('.player-update-trigger'), '${playerName.replace(/'/g, "\\'")}')">ביטול</button>
      `;
      row.appendChild(form);
      form.querySelector('.update-amount').focus();
    }

    async function loadPlayers(forceRefresh = false) {
      const cached = localStorage.getItem(PLAYERS_CACHE_KEY);

      if (cached && !forceRefresh) {
        renderPlayers(JSON.parse(cached));
      }

      try {
        const res = await fetch(API_URL + '?action=getPlayers');
        const data = await res.json();
        const players = data.players || [];
        localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify(players));
        renderPlayers(players);
      } catch (err) {
        console.error('Error loading players:', err);
        if (!cached) {
          playerListEl.innerHTML = '<div class="player-empty">שגיאה בטעינת שחקנים</div>';
        }
      }
    }

    addPlayerBtn.addEventListener('click', async () => {
      const name = newPlayerNameInput.value.trim();
      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';

      if (!name) {
        playersStatusEl.textContent = 'יש להזין שם שחקן';
        playersStatusEl.classList.add('error');
        newPlayerNameInput.focus();
        return;
      }

      addPlayerBtn.disabled = true;
      addPlayerBtn.textContent = 'מוסיף...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'addPlayer', name })
        });

        playersStatusEl.textContent = `${name} נוסף בהצלחה!`;
        playersStatusEl.classList.add('success');
        newPlayerNameInput.value = '';

        // Wait briefly for the server to process, then reload
        setTimeout(() => loadPlayers(true), 1500);
      } catch (err) {
        console.error(err);
        playersStatusEl.textContent = 'שגיאה בהוספת שחקן';
        playersStatusEl.classList.add('error');
      } finally {
        addPlayerBtn.disabled = false;
        addPlayerBtn.textContent = 'הוסף שחקן';
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 3000);
      }
    });

    async function submitPlayerUpdate(playerName, btn) {
      const form = btn.closest('.player-update-form');
      const countInput = form.querySelector('.update-count');
      const amountInput = form.querySelector('.update-amount');
      const count = parseFloat(countInput.value) || 0;
      const amount = parseFloat(amountInput.value) || 0;

      if (count === 0 && amount === 0) {
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'יש להזין כמות או סכום';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'שומר...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'updatePlayer', name: playerName, count, amount })
        });

        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = `${playerName} עודכן בהצלחה!`;
        openUpdateRow = null;

        setTimeout(() => loadPlayers(true), 1500);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה בעדכון שחקן';
        btn.disabled = false;
        btn.textContent = 'שמור';
      } finally {
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 3000);
      }
    }

    async function deletePlayer(playerName, btn) {
      if (!confirm('למחוק את השחקן "' + playerName + '"? הפעולה בלתי הפיכה.')) {
        return;
      }

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';
      btn.disabled = true;

      if (openUpdateRow === playerName) {
        openUpdateRow = null;
      }

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'deletePlayer', name: playerName })
        });

        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = playerName + ' נמחק בהצלחה';
        setTimeout(() => loadPlayers(true), 1500);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה במחיקת שחקן';
        btn.disabled = false;
      } finally {
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 3000);
      }
    }

    initUserSelection();
    loadTotals();
    loadPlayers();

  </script>
</body>
</html>
