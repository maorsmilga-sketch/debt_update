<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ניהול כספים - מאור ועידו</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #059669; 
      --primary-hover: #047857; 
      --bg-color: #F3F4F6;
      --card-bg: #ffffff;
      --text-main: #1F2937;
      --text-secondary: #6B7280;
      --border-color: #E5E7EB;
      --success-color: #10B981;
      --error-color: #EF4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Rubik', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 30px;
      overflow-x: hidden;
      overflow-y: visible;
      position: relative;
      box-sizing: border-box;
    }

    /* לוגואים */
    .corner-logo {
      position: absolute;
      top: 20px;
      width: 50px;
      height: auto;
      opacity: 0.9;
    }
    .logo-right { right: 20px; }
    .logo-left { left: 20px; }

    @media (max-width: 400px) {
      .corner-logo { width: 40px; top: 15px; }
      .logo-right { right: 15px; }
      .logo-left { left: 15px; }
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 10px;
      margin-bottom: 25px;
    }

    /* --- סיכומים וטעינה --- */
    .totals-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .total-card {
      flex: 1;
      text-align: center;
      background: #F9FAFB;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      min-width: 0;
      position: relative;
    }

    .total-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .total-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-color);
      min-height: 24px; /* שומר מקום לתוכן */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Skeleton Loader Animation (אנימציית שלד) --- */
    .skeleton {
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
      width: 70%;
      height: 20px;
      display: inline-block;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* אייקון טעינה קטן כשמרעננים מידע קיים */
    .refresh-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 5px;
      left: 5px;
      display: none; /* מוסתר כברירת מחדל */
    }
    .refreshing .refresh-spinner { display: block; }


    /* --- שאר העיצוב (ללא שינוי) --- */
    .section-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: block;
    }
    .user-selector { display: flex; gap: 10px; margin-bottom: 25px; }
    .user-option { flex: 1; position: relative; }
    .user-option input[type="radio"] { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
    .user-card {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 5px; background: #fff; border: 2px solid var(--border-color);
      border-radius: 12px; cursor: pointer; font-weight: 500; font-size: 0.95rem;
      transition: all 0.2s ease; color: var(--text-secondary); white-space: nowrap;
    }
    .user-option input[type="radio"]:checked + .user-card {
      border-color: var(--primary-color); background-color: #ECFDF5;
      color: var(--primary-color); font-weight: 700; box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2); 
    }
    .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .amount-btn {
      background: #fff; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 12px 0; border-radius: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s;
      font-family: 'Rubik', sans-serif;
    }
    .amount-btn:hover { background-color: #F3F4F6; border-color: #D1D5DB; }
    .amount-btn:active { transform: scale(0.95); background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    .input-group { margin-bottom: 15px; }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%; padding: 14px 15px; border: 1px solid var(--border-color);
      border-radius: 12px; font-size: 1rem; font-family: 'Rubik', sans-serif;
      box-sizing: border-box; transition: border-color 0.2s; background: #F9FAFB;
    }
    .input-wrapper input:focus { outline: none; border-color: var(--primary-color); background: #fff; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1); }
    .optional-tag { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: #9CA3AF; pointer-events: none; }
    .submit-btn {
      width: 100%; padding: 16px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
      transition: background-color 0.2s, transform 0.1s; font-family: 'Rubik', sans-serif;
      margin-top: 10px; box-shadow: 0 4px 6px rgba(5, 150, 105, 0.3); 
    }
    .submit-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(1px); }
    .submit-btn:disabled { background-color: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }
    .status { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height: 20px; font-weight: 500; }
    .status.error { color: var(--error-color); }
    .status.success { color: var(--success-color); }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Player Management Section --- */
    .players-section {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px solid var(--border-color);
    }
    .players-section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      text-align: center;
    }
    .players-bucket-hint {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
      margin: 0 0 16px;
      padding: 0 6px;
    }
    .add-player-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .add-player-form input {
      flex: 1 1 140px;
      min-width: 0;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: 'Rubik', sans-serif;
      background: #F9FAFB;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .add-player-form input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }
    .add-player-form button {
      flex: 0 1 auto;
      padding: 12px 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      white-space: nowrap;
      transition: background-color 0.2s;
      box-sizing: border-box;
    }
    .add-player-form button:hover { background-color: var(--primary-hover); }
    .add-player-form button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .player-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
      background: #F9FAFB;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }
    .player-row:hover { border-color: #D1D5DB; }
    .player-name-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 72px;
      flex-shrink: 0;
    }
    .player-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .player-last-updated {
      font-size: 0.7rem;
      color: var(--text-secondary);
      line-height: 1.25;
      max-width: 100%;
    }
    .player-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 14px;
      flex: 1;
      min-width: 0;
    }
    .player-count-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .player-stat-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .player-count-val,
    .player-amount-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-color);
      min-width: 1.5em;
    }
    .player-plus-one-btn {
      padding: 6px 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: background-color 0.2s, transform 0.1s;
    }
    .player-plus-one-btn:hover { background: var(--primary-hover); }
    .player-plus-one-btn:active { transform: scale(0.96); }
    .player-plus-one-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .player-reset-count-btn {
      padding: 6px 10px;
      background: #fff;
      border: 1.5px solid var(--text-secondary);
      color: var(--text-secondary);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: all 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .player-reset-count-btn:hover {
      background: #F3F4F6;
      border-color: #6B7280;
      color: var(--text-main);
    }
    .player-reset-count-btn:active { transform: scale(0.96); }
    .player-reset-count-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .player-total-display {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .player-amount-add {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .player-amount-input {
      width: 100px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Rubik', sans-serif;
      text-align: center;
      box-sizing: border-box;
      background: #fff;
    }
    .player-amount-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
    }
    .player-add-amount-btn {
      padding: 8px 14px;
      background: #fff;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: all 0.2s;
    }
    .player-add-amount-btn:hover {
      background: var(--primary-color);
      color: white;
    }
    .player-add-amount-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .player-row-actions {
      display: flex;
      align-items: flex-start;
      margin-right: auto;
      flex-shrink: 0;
    }
    .player-delete-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      background: #fff;
      border: 1px solid #FECACA;
      color: var(--error-color);
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
    }
    .player-delete-btn:hover {
      background: #FEF2F2;
      border-color: var(--error-color);
      color: #DC2626;
    }
    .player-delete-btn:active {
      transform: scale(0.94);
    }
    .player-delete-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .player-delete-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .player-list .skeleton-row {
      height: 52px;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 14px;
    }
    .players-status {
      text-align: center;
      font-size: 0.85rem;
      min-height: 18px;
      font-weight: 500;
      margin-top: 10px;
    }
    .players-status.error { color: var(--error-color); }
    .players-status.success { color: var(--success-color); }
    .player-empty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 20px 0;
    }
    .players-period-control {
      margin-bottom: 18px;
      padding: 14px;
      background: #F9FAFB;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }
    .period-mode-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .period-mode-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-main);
    }
    .period-inputs {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
    }
    .period-inputs label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-secondary);
    }
    .period-inputs input[type="month"] {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-family: 'Rubik', sans-serif;
      font-size: 0.95rem;
      background: #fff;
      max-width: 100%;
      box-sizing: border-box;
    }
    .period-inputs input[type="month"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
    }
    .player-period-hint {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .container {
        padding: 18px 14px;
        border-radius: 20px;
        max-width: 100%;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 18px;
      }
      .add-player-form {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 10px;
      }
      .add-player-form input {
        flex: none;
        width: 100%;
      }
      .add-player-form button {
        width: 100%;
        white-space: normal;
        padding: 13px 14px;
        line-height: 1.35;
      }
      .players-period-control {
        padding: 12px;
      }
      .player-row {
        flex-direction: column;
        align-items: stretch;
        padding: 12px 12px;
      }
      .player-name-block {
        width: 100%;
      }
      .player-controls {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .player-count-ctrl {
        width: 100%;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .player-total-display {
        width: 100%;
      }
      .player-amount-add {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .player-amount-input {
        flex: 1 1 100px;
        min-width: 0;
        width: auto;
        max-width: 100%;
      }
      .player-row-actions {
        margin-right: 0;
        width: auto;
        align-self: flex-end;
      }
      .player-delete-btn {
        width: 34px;
        box-sizing: border-box;
      }
      .player-reset-count-btn {
        font-size: 0.72rem;
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo1.png" alt="לוגו עץ" class="corner-logo logo-right">
    <img src="logo1.png" alt="לוגו עץ" class="corner-logo logo-left">
    
    <h1>ניהול כספים</h1>

    <div class="totals-container">
      <div class="total-card" id="cardMaor">
        <div class="refresh-spinner"></div>
        <div class="total-label">מאור</div>
        <div class="total-value" id="totalMaor"><span class="skeleton"></span></div>
      </div>
      <div class="total-card" id="cardIdo">
        <div class="refresh-spinner"></div>
        <div class="total-label">עידו</div>
        <div class="total-value" id="totalIdo"><span class="skeleton"></span></div>
      </div>
    </div>

    <span class="section-title">למי לעדכן?</span>
    <div class="user-selector">
      <label class="user-option">
        <input type="radio" name="user" value="מאור">
        <div class="user-card">מאור</div>
      </label>
      <label class="user-option">
        <input type="radio" name="user" value="עידו">
        <div class="user-card">עידו</div>
      </label>
    </div>

    <span class="section-title">בחירה מהירה</span>
    <div class="quick-amounts">
      <button type="button" class="amount-btn" data-amount="50">50</button>
      <button type="button" class="amount-btn" data-amount="100">100</button>
      <button type="button" class="amount-btn" data-amount="150">150</button>
      <button type="button" class="amount-btn" data-amount="200">200</button>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="number" id="manualAmount" step="1" placeholder="סכום אחר (או מינוס להורדה)">
      </div>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" id="note" placeholder="הערה">
        <span class="optional-tag">אופציונלי</span>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn">עדכן יתרה</button>
    <div class="status" id="status"></div>

    <!-- Player Management Section -->
    <div class="players-section">
      <div class="players-section-title">ניהול שחקנים</div>
      <p class="players-bucket-hint">הכמות והסכום מחושבים לפי <strong>קבוצה נוכחית</strong> של עדכוני כמות+סכום בלבד: נלקחים עד 5 העדכונים האחרונים לפי שארית (למשל אחרי 6 עדכונים — רק האחרון; אחרי 13 — שלושת האחרונים). עדכון «הוסף סכום» בלבד לא נספר כאן.</p>
      <div class="players-period-control" id="playersPeriodControl">
        <span class="section-title" style="margin-bottom: 0;">תקופת סיכום</span>
        <div class="period-mode-row">
          <label>
            <input type="radio" name="playersPeriodMode" value="all" checked>
            כל התקופה
          </label>
          <label>
            <input type="radio" name="playersPeriodMode" value="single">
            חודש בודד
          </label>
          <label>
            <input type="radio" name="playersPeriodMode" value="range">
            טווח חודשים
          </label>
        </div>
        <div id="periodSingleWrap" class="period-inputs" style="display: none;">
          <label>
            חודש ושנה
            <input type="month" id="playersPeriodSingle" aria-label="חודש ושנה לסיכום">
          </label>
        </div>
        <div id="periodRangeWrap" class="period-inputs" style="display: none;">
          <label>
            מחודש
            <input type="month" id="playersPeriodFrom" aria-label="חודש התחלה">
          </label>
          <label>
            עד חודש (כולל)
            <input type="month" id="playersPeriodTo" aria-label="חודש סיום">
          </label>
        </div>
      </div>
      <div class="add-player-form">
        <input type="text" id="newPlayerName" placeholder="שם שחקן חדש">
        <button type="button" id="addPlayerBtn">הוסף שחקן</button>
      </div>
      <div class="player-list" id="playerList">
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>
      <div class="players-status" id="playersStatus"></div>
    </div>
  </div>

  <script>
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyulObiNcnWdox6DgMHSOZeoAVUpcYpY3rgKNUZv8UmYSUP9uwUovS_w4tifGNCMu_mrQ/exec';
    // ==========================================

    const statusEl = document.getElementById('status');
    const totalMaorEl = document.getElementById('totalMaor');
    const totalIdoEl = document.getElementById('totalIdo');
    const manualAmountInput = document.getElementById('manualAmount');
    const noteInput = document.getElementById('note');
    const submitBtn = document.getElementById('submitBtn');
    const playerListEl = document.getElementById('playerList');
    const playersStatusEl = document.getElementById('playersStatus');
    const newPlayerNameInput = document.getElementById('newPlayerName');
    const addPlayerBtn = document.getElementById('addPlayerBtn');

    const USER_STORAGE_KEY = 'selectedUserMaorIdo_V2';
    const TOTALS_CACHE_KEY = 'cachedTotals_V2';
    const PLAYERS_CACHE_PREFIX = 'cachedPlayers_V2_';

    let playersPeriodLabelActive = false;

    function currentYmString() {
      const now = new Date();
      return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }

    function syncPeriodPanelVisibility() {
      const modeEl = document.querySelector('input[name="playersPeriodMode"]:checked');
      const mode = modeEl ? modeEl.value : 'all';
      const singleWrap = document.getElementById('periodSingleWrap');
      const rangeWrap = document.getElementById('periodRangeWrap');
      if (singleWrap) singleWrap.style.display = mode === 'single' ? 'flex' : 'none';
      if (rangeWrap) rangeWrap.style.display = mode === 'range' ? 'flex' : 'none';
    }

    function getPlayersPeriodState() {
      const modeEl = document.querySelector('input[name="playersPeriodMode"]:checked');
      const mode = modeEl ? modeEl.value : 'all';
      if (mode === 'all') {
        return {
          ok: true,
          query: '',
          cacheKey: PLAYERS_CACHE_PREFIX + 'all',
          showPeriodLabel: false
        };
      }
      if (mode === 'single') {
        const v = document.getElementById('playersPeriodSingle').value;
        if (!v) {
          return { ok: false, message: 'יש לבחור חודש ושנה' };
        }
        const q = '&fromYm=' + encodeURIComponent(v) + '&toYm=' + encodeURIComponent(v);
        return {
          ok: true,
          query: q,
          cacheKey: PLAYERS_CACHE_PREFIX + 'm_' + v,
          showPeriodLabel: true
        };
      }
      if (mode === 'range') {
        const from = document.getElementById('playersPeriodFrom').value;
        const to = document.getElementById('playersPeriodTo').value;
        if (!from || !to) {
          return { ok: false, message: 'יש לבחור חודש התחלה וחודש סיום' };
        }
        if (from > to) {
          return { ok: false, message: 'חודש ההתחלה לא יכול להיות אחרי חודש הסיום' };
        }
        const q = '&fromYm=' + encodeURIComponent(from) + '&toYm=' + encodeURIComponent(to);
        const safe = (s) => s.replace(/[^0-9-]/g, '');
        return {
          ok: true,
          query: q,
          cacheKey: PLAYERS_CACHE_PREFIX + safe(from) + '_' + safe(to),
          showPeriodLabel: true
        };
      }
      return { ok: true, query: '', cacheKey: PLAYERS_CACHE_PREFIX + 'all', showPeriodLabel: false };
    }

    function initPlayerPeriodControls() {
      const ym = currentYmString();
      const single = document.getElementById('playersPeriodSingle');
      const from = document.getElementById('playersPeriodFrom');
      const to = document.getElementById('playersPeriodTo');
      if (single) single.value = ym;
      if (from) from.value = ym;
      if (to) to.value = ym;

      document.querySelectorAll('input[name="playersPeriodMode"]').forEach(function (r) {
        r.addEventListener('change', function () {
          syncPeriodPanelVisibility();
          loadPlayers(true);
        });
      });
      [single, from, to].forEach(function (el) {
        if (el) el.addEventListener('change', function () { loadPlayers(true); });
      });
      syncPeriodPanelVisibility();
    }

    function initUserSelection() {
      const radios = document.querySelectorAll('input[name="user"]');
      const savedUser = localStorage.getItem(USER_STORAGE_KEY);
      let userToSelect = savedUser || 'מאור';
      
      const radioToCheck = Array.from(radios).find(r => r.value === userToSelect);
      if (radioToCheck) radioToCheck.checked = true;

      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          if (radio.checked) {
            localStorage.setItem(USER_STORAGE_KEY, radio.value);
            statusEl.textContent = ''; 
          }
        });
      });
    }

    document.querySelectorAll('.amount-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        manualAmountInput.value = btn.getAttribute('data-amount');
        manualAmountInput.focus();
      });
    });

    submitBtn.addEventListener('click', async () => {
      const userRadio = document.querySelector('input[name="user"]:checked');
      const user = userRadio ? userRadio.value : null;
      const amountStr = manualAmountInput.value.trim();
      const note = noteInput.value.trim();

      statusEl.className = 'status';
      statusEl.textContent = '';

      if (!user) {
        statusEl.textContent = 'יש לבחור למי לעדכן';
        statusEl.classList.add('error');
        return;
      }

      if (!amountStr) {
        statusEl.textContent = 'יש להזין סכום';
        statusEl.classList.add('error');
        manualAmountInput.focus();
        return;
      }

      const amount = parseFloat(amountStr);
      if (isNaN(amount)) {
        statusEl.textContent = 'הסכום אינו תקין';
        statusEl.classList.add('error');
        return;
      }

      const originalBtnText = submitBtn.textContent;
      submitBtn.innerHTML = 'מעדכן... <span class="spinner"></span>';
      submitBtn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, amount, note })
        });

        statusEl.textContent = 'עודכן בהצלחה!';
        statusEl.classList.add('success');
        manualAmountInput.value = '';
        noteInput.value = '';
        
        // לאחר עדכון, נטען שוב מהשרת
        await loadTotals(true);

      } catch (err) {
        console.error(err);
        statusEl.textContent = 'שגיאה בתקשורת עם השרת';
        statusEl.classList.add('error');
      } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
        setTimeout(() => {
            if(statusEl.classList.contains('success')) statusEl.textContent = '';
        }, 3000);
      }
    });

    // פונקציה שמציגה נתונים על המסך
    function renderTotals(totals) {
      if (!totals) return;
      totalMaorEl.innerHTML = (totals['מאור'] || 0).toLocaleString() + ' ₪';
      totalIdoEl.innerHTML = (totals['עידו'] || 0).toLocaleString() + ' ₪';
    }

    // פונקציית הטעינה החכמה
    async function loadTotals(forceRefresh = false) {
      
      // 1. נסה לטעון מהזיכרון המקומי קודם כל (לתצוגה מיידית)
      const cachedData = localStorage.getItem(TOTALS_CACHE_KEY);
      
      if (cachedData && !forceRefresh) {
        // מציגים את המידע הישן מיד
        renderTotals(JSON.parse(cachedData));
        // מוסיפים אינדיקציה שאנחנו מרעננים ברקע (spinner קטן בצד)
        document.querySelectorAll('.total-card').forEach(el => el.classList.add('refreshing'));
      }

      try {
        // 2. מבצעים את הבקשה האמיתית לשרת
        const res = await fetch(API_URL);
        const data = await res.json();
        const totals = data.totals || {};

        // 3. שומרים את המידע החדש בזיכרון המקומי לפעם הבאה
        localStorage.setItem(TOTALS_CACHE_KEY, JSON.stringify(totals));

        // 4. מעדכנים את המסך עם המידע המעודכן ביותר
        renderTotals(totals);

      } catch (err) {
        console.error("Error loading totals:", err);
        // אם הייתה שגיאה ואין לנו כלום בזיכרון, נשאיר את אנימציית הטעינה או נציג שגיאה
        if (!cachedData) {
            totalMaorEl.innerHTML = '-';
            totalIdoEl.innerHTML = '-';
        }
      } finally {
        // מסירים את הספינר הקטן של הרענון
        document.querySelectorAll('.total-card').forEach(el => el.classList.remove('refreshing'));
      }
    }

    // ==========================================
    // Player Management
    // ==========================================

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function jsStringLiteral(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function formatPlayerLastUpdated(iso) {
      if (!iso) return 'עדיין לא עודכן';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return 'עדיין לא עודכן';
      return d.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
    }

    function renderPlayers(players) {
      if (!players || players.length === 0) {
        playerListEl.innerHTML = '<div class="player-empty">אין שחקנים עדיין. הוסף שחקן חדש למעלה.</div>';
        return;
      }
      const periodRow = playersPeriodLabelActive
        ? '<div class="player-period-hint" style="flex-basis:100%;width:100%;margin-top:2px;">כמות וסכום (כמות+סכום) — בתקופה ובקבוצה הנוכחית</div>'
        : '';
      playerListEl.innerHTML = players.map(p => {
        const safeName = escapeHtml(p.name);
        const jsName = jsStringLiteral(p.name);
        const dataPlayer = encodeURIComponent(p.name);
        const lastLine = formatPlayerLastUpdated(p.lastUpdated);
        return `
        <div class="player-row" data-player="${dataPlayer}">
          <div class="player-name-block">
            <div class="player-name">${safeName}</div>
            <div class="player-last-updated">${escapeHtml(lastLine)}</div>
          </div>
          <div class="player-controls">
            <div class="player-count-ctrl">
              <span class="player-stat-label">כמות</span>
              <span class="player-count-val">${(p.count || 0).toLocaleString()}</span>
              <button type="button" class="player-plus-one-btn" onclick="incrementPlayerCount('${jsName}', this)" title="נדרש למלא סכום בשדה למטה לפני לחיצה">+1</button>
              <button type="button" class="player-reset-count-btn" onclick="resetPlayerCount('${jsName}', this)" title="מאפס את סך הכמות המצטבר מכל הזמנים">איפוס כמות</button>
            </div>
            <div class="player-total-display">
              <span class="player-stat-label">סכום</span>
              <span class="player-amount-val">${(p.amount || 0).toLocaleString()} ₪</span>
            </div>
            ${periodRow}
            <div class="player-amount-add">
              <input type="number" class="player-amount-input" step="any" placeholder="סכום (חובה לפני +1)" inputmode="decimal" aria-label="סכום להוספה; נדרש לפני עדכון כמות">
              <button type="button" class="player-add-amount-btn" onclick="submitPlayerAmount('${jsName}', this)">הוסף סכום</button>
            </div>
          </div>
          <div class="player-row-actions">
            <button type="button" class="player-delete-btn" onclick="deletePlayer('${jsName}', this)" title="מחק שחקן" aria-label="מחק שחקן">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        </div>`;
      }).join('');
    }

    async function loadPlayers(forceRefresh = false) {
      const period = getPlayersPeriodState();
      if (!period.ok) {
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = period.message;
        return;
      }

      playersPeriodLabelActive = period.showPeriodLabel;
      const cacheKey = period.cacheKey;
      const cached = localStorage.getItem(cacheKey);

      if (cached && !forceRefresh) {
        try {
          renderPlayers(JSON.parse(cached));
        } catch (e) {
          console.error(e);
        }
      }

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';

      try {
        const url = API_URL + '?action=getPlayers' + period.query;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.success) {
          playersStatusEl.className = 'players-status error';
          playersStatusEl.textContent = data.error || 'שגיאה בטעינת שחקנים';
          if (!cached) {
            playerListEl.innerHTML = '<div class="player-empty">לא ניתן לטעון שחקנים</div>';
          }
          return;
        }
        const players = data.players || [];
        localStorage.setItem(cacheKey, JSON.stringify(players));
        renderPlayers(players);
        playersStatusEl.textContent = '';
      } catch (err) {
        console.error('Error loading players:', err);
        if (!cached) {
          playerListEl.innerHTML = '<div class="player-empty">שגיאה בטעינת שחקנים</div>';
        }
      }
    }

    addPlayerBtn.addEventListener('click', async () => {
      const name = newPlayerNameInput.value.trim();
      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';

      if (!name) {
        playersStatusEl.textContent = 'יש להזין שם שחקן';
        playersStatusEl.classList.add('error');
        newPlayerNameInput.focus();
        return;
      }

      addPlayerBtn.disabled = true;
      addPlayerBtn.textContent = 'מוסיף...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'addPlayer', name })
        });

        playersStatusEl.textContent = `${name} נוסף בהצלחה!`;
        playersStatusEl.classList.add('success');
        newPlayerNameInput.value = '';

        // Wait briefly for the server to process, then reload
        setTimeout(() => loadPlayers(true), 1500);
      } catch (err) {
        console.error(err);
        playersStatusEl.textContent = 'שגיאה בהוספת שחקן';
        playersStatusEl.classList.add('error');
      } finally {
        addPlayerBtn.disabled = false;
        addPlayerBtn.textContent = 'הוסף שחקן';
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 3000);
      }
    });

    async function postPlayerUpdate(playerName, count, amount) {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updatePlayer', name: playerName, count, amount })
      });
    }

    async function incrementPlayerCount(playerName, btn) {
      const row = btn.closest('.player-row');
      const input = row ? row.querySelector('.player-amount-input') : null;
      const amountStr = input ? input.value.trim() : '';
      const amount = parseFloat(amountStr);

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';

      if (amountStr === '' || isNaN(amount)) {
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'יש להזין סכום בשדה למטה לפני עדכון כמות (+1)';
        if (input) input.focus();
        return;
      }
      if (amount === 0) {
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'יש להזין סכום השונה מאפס לפני עדכון כמות';
        if (input) input.focus();
        return;
      }

      btn.disabled = true;

      try {
        await postPlayerUpdate(playerName, 1, amount);
        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = 'כמות וסכום עודכנו (+1)';
        await loadPlayers(true);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה בעדכון כמות';
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 2500);
      }
    }

    async function resetPlayerCount(playerName, btn) {
      if (!confirm('לאפס את סך הכמות המצטבר של "' + playerName + '" ל־0?\nהחישוב הוא על כל הזמנים (לא רק התקופה המוצגת), ונרשמת שורה ביומן Debt.')) {
        return;
      }

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';
      btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'resetPlayerCount', name: playerName })
        });
        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = 'כמות אופסה (סך מצטבר)';
        await loadPlayers(true);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה באיפוס כמות';
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 2500);
      }
    }

    async function submitPlayerAmount(playerName, btn) {
      const row = btn.closest('.player-row');
      const input = row ? row.querySelector('.player-amount-input') : null;
      const amountStr = input ? input.value.trim() : '';
      const amount = parseFloat(amountStr);

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';

      if (amountStr === '' || isNaN(amount)) {
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'יש להזין סכום תקין';
        if (input) input.focus();
        return;
      }

      btn.disabled = true;

      try {
        await postPlayerUpdate(playerName, 0, amount);
        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = 'סכום עודכן';
        if (input) input.value = '';
        await loadPlayers(true);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה בעדכון סכום';
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 2500);
      }
    }

    async function deletePlayer(playerName, btn) {
      if (!confirm('למחוק את השחקן "' + playerName + '"? הפעולה בלתי הפיכה.')) {
        return;
      }

      playersStatusEl.className = 'players-status';
      playersStatusEl.textContent = '';
      btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'deletePlayer', name: playerName })
        });

        playersStatusEl.className = 'players-status success';
        playersStatusEl.textContent = playerName + ' נמחק בהצלחה';
        setTimeout(() => loadPlayers(true), 1500);
      } catch (err) {
        console.error(err);
        playersStatusEl.className = 'players-status error';
        playersStatusEl.textContent = 'שגיאה במחיקת שחקן';
        btn.disabled = false;
      } finally {
        setTimeout(() => {
          if (playersStatusEl.classList.contains('success')) playersStatusEl.textContent = '';
        }, 3000);
      }
    }

    initUserSelection();
    initPlayerPeriodControls();
    loadTotals();
    loadPlayers();

  </script>
</body>
</html>
